<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241d12"/>
      <stop offset="1" stop-color="#0f0c08"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5730"/>
      <stop offset="1" stop-color="#2a2114"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#e2b34a"/>
      <stop offset="1" stop-color="#9a6a12"/>
    </linearGradient>
    <radialGradient id="spell" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.35" stop-color="#ffb02e"/>
      <stop offset="0.75" stop-color="#c8360a"/>
      <stop offset="1" stop-color="#4a0f00"/>
    </radialGradient>
    <radialGradient id="glowHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcc55" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffcc55" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="92" fill="none" stroke="#5c4a26" stroke-width="4" stroke-opacity="0.8"/>

  <!-- halo behind the cloned button -->
  <circle cx="396" cy="256" r="120" fill="url(#glowHalo)"/>

  <!-- source button -->
  <g transform="translate(40,180)" filter="url(#shadow)">
    <rect x="4" y="4" width="144" height="144" rx="16" fill="url(#frame)" stroke="url(#gold)" stroke-width="8"/>
    <rect x="18" y="18" width="116" height="116" rx="8" fill="url(#spell)"/>
    <rect x="18" y="18" width="116" height="116" rx="8" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M86 30 L48 84 L74 84 L60 124 L104 66 L78 66 Z"
          fill="#fff9e0" stroke="#ffd070" stroke-width="3" stroke-linejoin="round" filter="url(#boltGlow)"/>
  </g>

  <!-- arrow -->
  <g filter="url(#shadow)">
    <path d="M206 236 H272 V206 L322 256 L272 306 V276 H206 Z"
          fill="url(#gold)" stroke="#3a2a0c" stroke-width="5" stroke-linejoin="round"/>
    <path d="M214 244 H266" fill="none" stroke="#fff4cc" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- cloned button -->
  <g transform="translate(320,180)" filter="url(#shadow)">
    <rect x="4" y="4" width="144" height="144" rx="16" fill="url(#frame)" stroke="url(#gold)" stroke-width="8"/>
    <rect x="18" y="18" width="116" height="116" rx="8" fill="url(#spell)"/>
    <rect x="18" y="18" width="116" height="116" rx="8" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M86 30 L48 84 L74 84 L60 124 L104 66 L78 66 Z"
          fill="#fff9e0" stroke="#ffd070" stroke-width="3" stroke-linejoin="round" filter="url(#boltGlow)"/>
  </g>
</svg>
